APP_NAME = Layero Workspace Forge
RUN_USER = @USER@
WORK_PATH = @HOME@/.local/state/forgejo
RUN_MODE = prod

[server]
HTTP_ADDR = 127.0.0.1
HTTP_PORT = 3030
ROOT_URL = http://127.0.0.1:3030/
DISABLE_SSH = true
OFFLINE_MODE = true

[database]
DB_TYPE = sqlite3
PATH = @HOME@/.local/state/forgejo/data/forgejo.db

[security]
INSTALL_LOCK = true
SECRET_KEY = @FORGEJO_SECRET_KEY@
INTERNAL_TOKEN = @FORGEJO_INTERNAL_TOKEN@

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = true

[repository]
DEFAULT_BRANCH = main

[oauth2]
JWT_SECRET = @FORGEJO_JWT_SECRET@
