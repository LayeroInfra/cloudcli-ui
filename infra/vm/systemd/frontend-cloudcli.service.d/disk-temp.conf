[Service]
# /tmp is RAM (tmpfs): sessions and builds get a disk-backed /tmp instead.
Environment=TMPDIR=%h/.local/state/dev-tmp CLAUDE_CODE_TMPDIR=%h/.local/state/dev-tmp
BindPaths=%h/.local/state/dev-tmp:/tmp
BindPaths=-/tmp/.X11-unix:/tmp/.X11-unix -/tmp/.ICE-unix:/tmp/.ICE-unix -/tmp/tmux-%U:/tmp/tmux-%U
