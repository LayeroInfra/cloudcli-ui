<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Layero Workspace</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fcfcfa;
      --card: #ffffff;
      --ink: #141413;
      --muted: #73726c;
      --border: #dedcd1;
      --soft: #f3f1ea;
      --ring: rgba(20, 20, 19, 0.12);
      --danger: #ff383c;
      --r: 10px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 "Encode Sans", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
    }
    .shell {
      width: 100%;
      max-width: 400px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .brand-logo {
      display: block;
      height: 18px;
      width: auto;
      color: var(--ink);
    }
    .brand-rule {
      width: 1px;
      height: 16px;
      background: var(--border);
      flex-shrink: 0;
    }
    .brand span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .lead {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 1px 2px rgba(20, 20, 19, 0.04);
    }
    label {
      display: block;
      margin: 0 0 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
    }
    .field { margin-bottom: 14px; }
    .field:last-of-type { margin-bottom: 18px; }
    .hint {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }
    .hint code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      background: var(--soft);
      border-radius: 4px;
      padding: 1px 5px;
    }
    .workspace-wrap {
      display: flex;
      align-items: stretch;
      gap: 0;
      border: 1px solid var(--border);
      border-radius: var(--r);
      background: var(--card);
      overflow: hidden;
      transition: border-color .15s, box-shadow .15s;
    }
    .workspace-wrap:focus-within {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px var(--ring);
    }
    .workspace-wrap input {
      border: 0 !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      flex: 1;
      min-width: 0;
    }
    .suffix {
      display: flex;
      align-items: center;
      padding: 0 10px 0 0;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      background: var(--card);
      user-select: none;
    }
    input[type="text"],
    input[type="password"] {
      width: 100%;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: var(--r);
      background: var(--card);
      padding: 0 12px;
      font: inherit;
      color: var(--ink);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="text"]:focus,
    input[type="password"]:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px var(--ring);
    }
    input::placeholder { color: #9c9a92; }
    .error {
      display: none;
      margin: -6px 0 14px;
      padding: 10px 12px;
      border-radius: var(--r);
      background: color-mix(in srgb, var(--danger) 8%, white);
      border: 1px solid color-mix(in srgb, var(--danger) 28%, white);
      color: #b91c1c;
      font-size: 12px;
    }
    .error.show { display: block; }
    button[type="submit"] {
      width: 100%;
      height: 42px;
      border: 0;
      border-radius: var(--r);
      background: var(--ink);
      color: #fafafa;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    button[type="submit"]:hover { opacity: 0.92; }
    button[type="submit"]:active { transform: scale(0.98); }
    button[type="submit"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .foot {
      margin-top: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="brand">
      <img class="brand-logo" src="/logo.svg" alt="Layero" width="94" height="22" />
      <span class="brand-rule" aria-hidden="true"></span>
      <span>Workspace</span>
    </div>
    <h1>Вход в пространство</h1>
    <p class="lead">Укажите адрес пространства и данные для входа в Layero Workspace.</p>
    <form class="card" id="form" autocomplete="on">
      <div class="error" id="error" role="alert"></div>

      <div class="field">
        <label for="workspace">Адрес пространства</label>
        <div class="workspace-wrap">
          <input id="workspace" name="workspace" type="text" autocomplete="off" spellcheck="false" required />
          <span class="suffix">.workspace.layero.app</span>
        </div>
        <div class="hint">Можно ввести полный адрес пространства.</div>
      </div>

      <div class="field">
        <label for="username">Имя пользователя</label>
        <input id="username" name="username" type="text" autocomplete="username" required />
      </div>

      <div class="field">
        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>

      <button type="submit" id="submit">Войти</button>
    </form>
    <p class="foot">Пароль не сохраняется на диске</p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const workspaceInput = document.getElementById('workspace');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const errorEl = document.getElementById('error');
    const form = document.getElementById('form');
    const submitBtn = document.getElementById('submit');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('show');
    }

    // Prefill: strip domain suffix for the slug field when possible
    const preWorkspace = params.get('workspace') || '';
    const domain = '.workspace.layero.app';
    if (preWorkspace.endsWith(domain)) {
      workspaceInput.value = preWorkspace.slice(0, -domain.length);
    } else {
      workspaceInput.value = preWorkspace;
    }
    usernameInput.value = params.get('username') || '';
    if (params.get('error')) showError(params.get('error'));

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('show');
      submitBtn.disabled = true;
      try {
        const res = await fetch('/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            workspace: workspaceInput.value.trim(),
            username: usernameInput.value.trim(),
            password: passwordInput.value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showError(data.error || 'Не удалось войти');
          submitBtn.disabled = false;
          return;
        }
        document.body.innerHTML = '<div class="shell"><div class="brand"><img class="brand-logo" src="/logo.svg" alt="Layero" width="94" height="22" /><span class="brand-rule" aria-hidden="true"></span><span>Workspace</span></div><h1>Подключаем…</h1><p class="lead">Подождите, пока откроется пространство.</p></div>';
        if (!params.has('native')) setTimeout(() => window.close(), 400);
      } catch (err) {
        showError('Нет связи с приложением. Запустите Layero Workspace снова.');
        submitBtn.disabled = false;
      }
    });

    (workspaceInput.value ? usernameInput.value ? passwordInput : usernameInput : workspaceInput).focus();
  </script>
</body>
</html>
